spring:
  application:
    name: dungeontasks-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dungeontasks}
    username: ${DB_USERNAME:dungeontasks}
    password: ${DB_PASSWORD}
  jooq:
    sql-dialect: POSTGRES
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${SERVER_PORT:8080}
